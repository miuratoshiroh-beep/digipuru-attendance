<style>
:root{
  --bg:#e9edf1;--surface:#ffffff;--sunk:#f3f5f8;--ink:#132238;--mute:#5c6a7d;--line:#d3dae2;
  --in:#2747b8;--in-soft:#e6ebfa;--out:#b0263c;--out-soft:#f8e6e9;
  --ok:#2e7a58;--caution:#a77800;--warn:#c9561a;--over:#b0263c;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;font-feature-settings:"palt","tnum";min-height:100vh;padding-bottom:72px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--in);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.loading{color:var(--mute);padding:40px 0;text-align:center}

.top{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:10px}
.brand{font-weight:700;letter-spacing:.1em}
.who{font-size:13px;opacity:.9;text-align:right}

/* タブ：スマホは画面下、PCは上 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0 14px;font-size:13px;color:var(--mute);position:relative;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--ink);border-radius:0 0 3px 3px}
.tabs .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;line-height:18px;margin-left:4px;padding:0 5px}
@media (min-width:900px){
  body{padding-bottom:0}
  .tabs{position:static;justify-content:center;border-top:0;border-bottom:1px solid var(--line)}
  .tabs button{flex:0 0 auto;padding:12px 22px}
  .tabs button[aria-current="page"]::before{top:auto;bottom:0;border-radius:3px 3px 0 0}
}
.main{max-width:560px;margin:0 auto;padding:16px 18px 32px;background:var(--surface);min-height:calc(100vh - 110px)}
.main.wide{max-width:1180px}
@media (min-width:600px){.main{margin:18px auto;border-radius:16px;min-height:auto;box-shadow:0 20px 50px -30px rgba(19,34,56,.4)}}

/* 打刻 */
.today{font-size:14px;color:var(--mute)}
.clock{font-size:64px;font-weight:300;line-height:1.1;margin:2px 0 4px}
.clock small{font-size:24px;color:var(--mute);margin-left:4px}
.status{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;line-height:1.7;white-space:nowrap}
.pill.in{background:var(--in-soft);color:var(--in)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.mute{background:var(--sunk);color:var(--mute)}
.pill.ok,.pill.normal{background:#e3f1ea;color:var(--ok)}
.pill.c,.pill.caution{background:#f7efd6;color:var(--caution)}
.pill.w,.pill.warn{background:#fbe8dc;color:var(--warn)}
.pill.x,.pill.over{background:var(--out-soft);color:var(--over)}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch button{height:92px;border-radius:16px;font-size:22px;font-weight:600;letter-spacing:.1em;border:2px solid currentColor;transition:transform .08s ease}
.punch .p-in{color:var(--in);background:var(--in-soft)}
.punch .p-out{color:var(--out);background:var(--out-soft)}
.punch button:not(:disabled):active{transform:scale(.97)}
.punch button:disabled{color:#a5afbc;background:var(--sunk);border-color:var(--line)}
.strip{position:relative;height:58px;margin:22px 0 4px}
.strip .axis{position:absolute;left:0;right:0;top:24px;height:14px;background:var(--sunk);border-radius:3px}
.strip .band{position:absolute;top:24px;height:14px;background:#dde3ea}
.strip .plan{position:absolute;top:22px;height:18px;border:1.5px dashed var(--in);border-radius:3px}
.strip .brk{position:absolute;top:24px;height:14px;background:repeating-linear-gradient(135deg,#c3ccd7 0 3px,transparent 3px 6px)}
.strip .span{position:absolute;top:27px;height:8px;background:var(--ink);border-radius:2px;opacity:.85}
.strip .mk{position:absolute;top:14px;width:2px;height:34px;transform:translateX(-1px)}
.strip .mk span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;white-space:nowrap}
.strip .mk.in{background:var(--in)} .strip .mk.in span{color:var(--in)}
.strip .mk.out{background:var(--out)} .strip .mk.out span{color:var(--out);top:auto;bottom:-18px}
.strip .tick{position:absolute;top:40px;font-size:10.5px;color:var(--mute);transform:translateX(-50%)}
.legend{font-size:11.5px;color:var(--mute);display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;margin-right:4px}
.result{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 18px}
.result div{padding:8px 0;text-align:center}
.result div+div{border-left:1px solid var(--line)}
.result b{display:block;font-size:20px;font-weight:500}
.result span{font-size:12px;color:var(--mute)}

.alert{border-left:3px solid var(--out);background:var(--out-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin-bottom:10px;font-size:14px}
.alert.info{border-color:var(--in);background:var(--in-soft)}
.alert .act{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.link-btn{font-weight:600;color:var(--in);text-decoration:underline;text-underline-offset:3px}
.alert:not(.info) .link-btn{color:var(--out)}
h3.sec{font-size:13px;color:var(--mute);font-weight:500;margin:18px 0 6px}
h2.page{font-size:17px;font-weight:600;margin-bottom:10px}
.gauge{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ok)}
.gauge .fill.caution{background:var(--caution)} .gauge .fill.warn{background:var(--warn)} .gauge .fill.over{background:var(--over)}
.gauge i{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.g-val{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-val b{font-size:22px;font-weight:500}
.g-val span{font-size:12.5px;color:var(--mute);text-align:right}
.note{font-size:12px;color:var(--mute)}

/* マイ勤怠 */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav b{font-size:16px}
.monthnav button{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.monthnav button:disabled{opacity:.4}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:500;color:var(--mute)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(19,34,56,.12)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.sum div{background:#fff;padding:6px 8px}
.sum span{font-size:11.5px;color:var(--mute);display:block}
.sum b{font-size:16px;font-weight:500}
.days{list-style:none;border-top:1px solid var(--line)}
.day{width:100%;display:grid;grid-template-columns:54px 1fr 54px 54px;gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.day:hover{background:var(--sunk)}
.day .d{font-weight:600}
.day .d small{font-weight:400;margin-left:2px}
.day .d.sat small{color:var(--in)} .day .d.sun small{color:var(--out)}
.day .t .pill{margin-left:4px}
.day .n{text-align:right}
.day .n small{display:block;font-size:10px;color:var(--mute);line-height:1.2}
.day.off .t{color:var(--mute)}
.day.future{opacity:.45}

/* カード・ボタン */
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:#fff}
.card .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.card .top2 b{font-weight:600}
.card .meta{font-size:12.5px;color:var(--mute)}
.top .who{display:flex;align-items:center;gap:14px}
.top .logout{color:inherit;opacity:.75;font-size:12.5px;text-decoration:none}
.top .logout:hover,.top .logout:focus-visible{opacity:1;text-decoration:underline}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.mtools .grow{flex:1}
.mtools input{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;width:96px;background:transparent;color:inherit}
table.m td{padding:2px 3px}
table.m input[type=text]{width:100%;min-width:90px;height:32px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:var(--sunk);color:inherit;font:inherit;font-size:13px}
table.m input[type=text]:focus{border-color:var(--in);outline:none;background:transparent}
table.m input.w-s{min-width:64px}table.m input.w-l{min-width:220px}
table.m select{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:inherit;font-size:13px}
table.m input[type=checkbox]{width:18px;height:18px;accent-color:var(--in)}
table.m th{font-size:12px}
.dirty{color:var(--out);font-size:13px}
.panel{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.panel h3{margin:0 0 6px;font-size:15px}
.panel p{margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.7}
.panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel a.btn{text-decoration:none;display:inline-flex;align-items:center}
.panel input{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
.card.sel{border-color:var(--in);box-shadow:inset 3px 0 0 var(--in)}
.card .top2 .chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input,.bulkbar input{width:18px;height:18px;accent-color:var(--in);margin:0}
.bulkbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;background:var(--in-soft);border-radius:var(--radius)}
.bulkbar label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.offset{margin-top:10px;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:13px}
.offset b{font-weight:600}
.diff{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:6px 0}
.diff s{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:disabled{background:#a5afbc}
.btn.ghost{border:1px solid var(--line);background:#fff}
.btn.ghost:disabled{color:#a5afbc}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.row-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 40%}
.sheet .row-btns .btn{min-height:44px}

/* ボトムシート */
.sheet-wrap{position:fixed;inset:0;background:rgba(19,34,56,.38);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:2px}
.sheet .sub{font-size:13px;color:var(--mute);margin-bottom:12px}
.kv{display:grid;grid-template-columns:118px 1fr;border-top:1px solid var(--line);font-size:14px}
.kv dt,.kv dd{padding:6px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mute)}
.kv dt.grp{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--ink);background:var(--sunk);padding:4px 6px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--out);font-size:13.5px;font-weight:500;margin-bottom:10px}

/* 管理者 */
.bar2{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.bar2 h2{font-size:17px;font-weight:600}
.bar2 p{font-size:13.5px;color:var(--mute)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}
table.t th{font-weight:500;color:var(--mute);font-size:12.5px;text-align:right;padding:8px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.t th.l,table.t th:first-child{text-align:left}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t td.l{text-align:left}
table.t td small{color:var(--mute);font-size:11px}
.closebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 16px;background:var(--sunk);border-radius:12px}
.closebox p{flex:1;min-width:240px;font-size:14px}
.closebox select{border:1px solid var(--line);border-radius:8px;padding:8px}

#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100vw - 32px))}
#toast div{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast div.error{background:var(--out)}
</style>
