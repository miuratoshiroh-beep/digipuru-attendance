<script>
/* ===================== 共通 ===================== */
var DOW = '日月火水木金土';
var TYPE = { fixed: '固定時間制', flex: 'フレックス', disc: '裁量労働', manager: '管理職' };
var KIND = { pre: '残業・早出の事前申請', fix: '打刻の修正', leave: '休暇' };
var STATUS = { pending: ['c', '承認待ち'], approved: ['ok', '承認済み'], rejected: ['x', '差し戻し'], cancelled: ['mute', '取り下げ'] };
var STAGE = { normal: '通常', caution: '注意', warn: '警告', over: '上限到達' };

function pad(n) { return (n < 10 ? '0' : '') + n; }
function hm(m) { if (m == null || m === '') return '—'; m = Math.round(m); return Math.floor(m / 60) + ':' + pad(m % 60); }
function hhmm(m) { if (m == null || m === '') return '--:--'; m = Math.round(m); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function md(s) { return Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)); }
function mdw(s) { var d = new Date(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10))); return md(s) + '（' + DOW[d.getDay()] + '）'; }
function ymLabel(ym) { return ym.slice(0, 4) + '年' + Number(ym.slice(5)) + '月度'; }
function addMonths(ym, n) { var d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function $(id) { return document.getElementById(id); }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
    r[fn].apply(r, args);
  });
}
var toastTimer = null;
function toast(msg, isError) {
  $('toast').innerHTML = '<div class="' + (isError ? 'error' : '') + '">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { $('toast').innerHTML = ''; }, isError ? 7000 : 4000);
}
function fail(e) { S.busy = false; toast(e && e.message ? e.message.replace(/^Error:\s*/, '') : String(e), true); render(); }

/* ===================== 状態 ===================== */
var S = {
  boot: null, tab: 'punch', busy: false,
  home: null, month: null, ym: null, viewEmp: null,
  reqs: null, appr: null, apprYm: null, team: null,
  admin: null, adminTab: 'close', adminYm: null, emps: null, formResult: null, formTarget: 'ALL',
  sheet: null, rejecting: null, sel: {},
  master: null, masterTable: 'employees', mail: null
};

function curYm() { return S.boot.today.slice(0, 7); }

/* ===================== 打刻 ===================== */
// 端末のタイムゾーンに関係なく日本時間で表示する
function jstNow() { var d = new Date(Date.now() + 9 * 3600000); return { h: d.getUTCHours(), m: d.getUTCMinutes(), s: d.getUTCSeconds() }; }
function nowMinClient() { var d = jstNow(); return d.h * 60 + d.m; }
function strip(h) {
  var t = h.today, e = h.emp, L = 360, W = 1080;
  function x(m) { return +(((Math.min(Math.max(m, L), L + W) - L) / W) * 100).toFixed(2); }
  var s = '<div class="strip" aria-hidden="true"><div class="axis"></div>';
  if (e.work_type === 'fixed') s += '<div class="band" style="left:' + x(e.sched_start) + '%;width:' + (x(e.sched_end) - x(e.sched_start)) + '%"></div>';
  if (t.preEnd != null || t.preStart != null) { var ps = t.preStart != null ? t.preStart : e.sched_start, pe = t.preEnd != null ? t.preEnd : e.sched_end; s += '<div class="plan" style="left:' + x(ps) + '%;width:' + (x(pe) - x(ps)) + '%"></div>'; }
  s += '<div class="brk" style="left:' + x(S.boot.rules.lunch_start) + '%;width:' + (x(S.boot.rules.lunch_end) - x(S.boot.rules.lunch_start)) + '%"></div>';
  if (t.punchIn != null) {
    var end = t.punchOut != null ? t.punchOut : Math.max(t.punchIn, nowMinClient());
    s += '<div class="span" style="left:' + x(t.punchIn) + '%;width:' + (x(end) - x(t.punchIn)).toFixed(2) + '%"></div>';
    s += '<div class="mk in" style="left:' + x(t.punchIn) + '%"><span>出 ' + hhmm(t.punchIn) + '</span></div>';
    if (t.punchOut != null) s += '<div class="mk out" style="left:' + x(t.punchOut) + '%"><span>退 ' + hhmm(t.punchOut) + '</span></div>';
  }
  [6, 9, 12, 15, 18, 21, 24].forEach(function (hr) { s += '<span class="tick" style="left:' + x(hr * 60) + '%">' + hr + '</span>'; });
  return s + '</div>';
}
function gaugeBar(v, max, ticks, cls) {
  return '<div class="gauge" role="img" aria-label="' + hm(v) + '／' + hm(max) + '"><div class="fill ' + cls + '" style="width:' + Math.min(100, v / max * 100) + '%"></div>' +
    ticks.map(function (t) { return '<i style="left:' + (t / max * 100) + '%"></i>'; }).join('') + '</div>';
}
function gaugeBlock(h) {
  var t = h.totals, e = h.emp, an = h.annual, s = '';
  if (e.work_type === 'flex') {
    var over = t.projected > t.frame;
    s += '<h3 class="sec">今月の労働時間（フレックス・月末に確定）</h3><div class="g-val"><b class="num">' + hm(t.done) + '</b><span>見込み ' + hm(t.projected) + '／法定総枠 ' + hm(t.frame) + '</span></div>' +
      gaugeBar(t.projected, t.frame * 1.15, [t.sched, t.frame], over ? 'warn' : '') +
      '<p class="note">所定 ' + hm(t.sched) + '・法定総枠 ' + hm(t.frame) + '。見込みが総枠を超えた分が残業になります' + (over ? '（現在の見込み ' + hm(t.legalOt) + '）' : '') + '</p>';
  } else if (e.work_type === 'disc' || e.work_type === 'manager') {
    s += '<h3 class="sec">今月の残業（見做し）</h3><div class="g-val"><b class="num">' + hm(t.ot36) + '</b><span>上限 ' + hm(t.limit) + '</span></div>' +
      '<h3 class="sec">健康管理の目安（実労働の8時間超過分）</h3><div class="g-val"><b class="num">' + hm(t.health) + '</b><span>基準 80:00</span></div>' +
      gaugeBar(t.health, 4800, [2700], t.health > 4800 ? 'over' : t.health > 2700 ? 'warn' : '');
  } else {
    s += '<h3 class="sec">今月の残業（日8時間超＋週40時間超）</h3><div class="g-val"><b class="num">' + hm(t.ot36) + '</b><span>上限 ' + hm(t.limit) + '　<span class="pill ' + t.stage + '">' + STAGE[t.stage] + '</span></span></div>' +
      gaugeBar(t.ot36, t.limit, [t.limit * 0.75, t.limit * 0.9], t.stage === 'normal' ? '' : t.stage) +
      '<p class="note">上限の75%で注意、90%で警告のメールが届きます</p>';
  }
  s += '<p class="note" style="margin-top:8px">年間累計 <b class="num">' + hm(an.total) + '</b>／720:00　上限を超えた月 ' + an.overCount + '／6回</p>';
  return s;
}
function viewPunch() {
  var h = S.home;
  if (!h) return '<p class="loading">読み込んでいます…</p>';
  var t = h.today, e = h.emp, st = h.state, status = '';
  if (st === 'before') status = '<span class="pill mute">未出勤</span>まだ出勤の打刻がありません';
  if (st === 'on') status = '<span class="pill in">勤務中</span>出勤 ' + hhmm(t.punchIn) + '　経過 <span id="elapsed" class="num">' + hm(Math.max(0, nowMinClient() - t.punchIn)) + '</span>';
  if (st === 'on_yesterday') status = '<span class="pill in">勤務中（前日から）</span>退勤を押すと前日の退勤として記録されます';
  if (st === 'done') status = '<span class="pill out">退勤済み</span>' + hhmm(t.punchIn) + '〜' + hhmm(t.punchOut);
  if (t.staggered) status += ' <span class="pill c">時差出勤</span>';
  if (t.preEnd != null) status += ' <span class="pill in">終業予定 ' + hhmm(t.preEnd) + '</span>';
  var al = '';
  h.issues.forEach(function (x) {
    if (x.flag === 'DEVIATION') al += '<div class="alert"><b>' + mdw(x.date) + ' の退勤 ' + hhmm(x.punchOut) + ' が終業予定（' + hhmm(x.planEnd) + '）より遅れています</b><br>業務だった場合は残業の事後申請、業務外の場合は理由を入力してください。<div class="act"><button class="link-btn" data-act="openDay" data-arg="' + x.date + '">入力する</button></div></div>';
    else al += '<div class="alert"><b>' + mdw(x.date) + ' の' + (x.flag === 'NO_RECORD' ? '出退勤の記録' : x.label.replace('未打刻', 'の打刻')) + 'がありません</b><div class="act"><button class="link-btn" data-act="newFix" data-arg="' + x.date + '">修正を申請する</button><button class="link-btn" data-act="newLeave" data-arg="' + x.date + '">休暇を申請する</button></div></div>';
  });
  var ps = h.prev.status;
  if (!ps.confirmed && !ps.closed) {
    var late = h.date > h.prev.deadline;
    al += '<div class="alert ' + (late ? '' : 'info') + '"><b>' + ymLabel(h.prev.ym) + 'の勤怠が未確定です</b><br>確定期限は ' + mdw(h.prev.deadline) + 'です' + (late ? '（期限を過ぎています）' : '') + '。<div class="act"><button class="link-btn" data-act="goMonth" data-arg="' + h.prev.ym + '">確認して確定する</button></div></div>';
  }
  var canIn = st === 'before', canOut = st === 'on' || st === 'on_yesterday';
  return '<p class="today">' + h.date.slice(0, 4) + '年' + mdw(h.date) + '・' + TYPE[e.work_type] + '</p>' +
    '<p class="clock num" id="clock">--:--</p><p class="status">' + status + '</p>' +
    '<div class="punch"><button class="p-in" data-act="punch" data-arg="IN" ' + (canIn && !S.busy ? '' : 'disabled') + '>出勤</button>' +
    '<button class="p-out" data-act="punch" data-arg="OUT" ' + (canOut && !S.busy ? '' : 'disabled') + '>退勤</button></div>' +
    strip(h) +
    '<div class="legend">' + (e.work_type === 'fixed' ? '<span><i style="background:#dde3ea"></i>所定 ' + hhmm(e.sched_start) + '〜' + hhmm(e.sched_end) + '</span>' : '') +
    '<span><i style="background:repeating-linear-gradient(135deg,#c3ccd7 0 3px,transparent 3px 6px)"></i>昼休</span>' +
    (t.preEnd != null || t.preStart != null ? '<span><i style="border:1.5px dashed var(--in)"></i>事前申請の範囲</span>' : '') + '</div>' +
    '<div class="result"><div><b class="num">' + (t.punchOut != null ? hm(t.work) : '—') + '</b><span>実労働</span></div>' +
    '<div><b class="num">' + (t.punchOut != null ? (e.work_type === 'flex' ? '月末' : hm(t.r)) : '—') + '</b><span>残業（当日）</span></div>' +
    '<div><b class="num">' + (t.punchOut != null ? hm(t.night) : '—') + '</b><span>深夜</span></div></div>' +
    (e.work_type === 'fixed' && st !== 'done' ? '<button class="btn ghost block" data-act="newPre" data-arg="' + h.date + '" style="margin-bottom:14px">今日の残業・早出を事前申請する</button>' : '') +
    al + gaugeBlock(h);
}

/* ===================== マイ勤怠（承認者・管理者は他の社員も閲覧） ===================== */
function viewLog() {
  var m = S.month;
  if (!m) return '<p class="loading">読み込んでいます…</p>';
  var t = m.totals, e = m.emp, st = m.status, ym = m.ym, own = !S.viewEmp;
  var banner = '';
  if (!own) banner += '<div class="alert info"><b>' + esc(e.name) + ' さんの勤怠（閲覧のみ）</b><div class="act"><button class="link-btn" data-act="backFromEmp">戻る</button></div></div>';
  if (st.closed) banner += '<div class="alert info">' + ymLabel(ym) + 'は締め済みです。内容の変更や申請はできません</div>';
  else if (ym < m.today.slice(0, 7)) {
    if (!st.confirmed) banner += own ? '<div class="alert"><b>内容を確認して確定してください</b><br>確定すると承認者に通知されます。打刻漏れ・乖離理由の未入力・承認待ちの申請があると確定できません。<div class="act"><button class="btn primary block" data-act="confirm" ' + (S.busy ? 'disabled' : '') + '>' + ymLabel(ym) + 'を確定する</button></div></div>' : '<div class="alert">本人がまだ確定していません</div>';
    else if (!st.approved) banner += '<div class="alert info">確定済みです。承認者の承認を待っています</div>';
    else banner += '<div class="alert info">承認済みです。経理の締めを待っています</div>';
  }
  var list = m.rows.map(function (d) {
    var future = d.date > m.today, dw = d.dow, tx = '';
    if (d.leaveType && !d.work) tx = '<span class="pill in">' + esc(d.leaveName) + '</span>';
    else if (d.punchIn != null || d.punchOut != null) tx = '<span class="num">' + hhmm(d.punchIn) + '–' + hhmm(d.punchOut) + '</span>' + (d.leaveType ? ' <span class="pill in">' + esc(d.leaveName) + '</span>' : '');
    else tx = d.type === 'work' ? (future ? (d.preEnd != null ? '<span class="pill in">終業予定 ' + hhmm(d.preEnd) + '</span>' : '') : '—') : (d.holidayName || (d.type === 'legal' ? '法定休日' : '所定休日'));
    d.flagLabels.forEach(function (f, i) { tx += ' <span class="pill ' + (d.flags[i] === 'EDITED' ? 'mute' : 'x') + '">' + f + '</span>'; });
    if (m.pending[d.date]) tx += ' <span class="pill c">申請中</span>';
    var ot = d.r + d.w40;
    return '<li><button class="day ' + (d.type !== 'work' && !d.work ? 'off' : '') + (future ? ' future' : '') + '" data-act="openDay" data-arg="' + d.date + '">' +
      '<span class="d ' + (dw === 6 ? 'sat' : dw === 0 || d.holidayName ? 'sun' : '') + '">' + Number(d.date.slice(8)) + '<small>' + DOW[dw] + '</small></span>' +
      '<span class="t">' + tx + '</span>' +
      '<span class="n num">' + (d.work ? hm(d.work) : '') + '<small>' + (d.work ? '実労働' : '') + '</small></span>' +
      '<span class="n num">' + (e.work_type === 'flex' ? '' : (ot ? hm(ot) : '')) + '<small>' + (ot && e.work_type !== 'flex' ? '残業' : '') + '</small></span></button></li>';
  }).join('');
  return '<div class="monthnav"><button data-act="month" data-arg="-1" aria-label="前の月">‹</button><b>' + ymLabel(ym) + '</b><button data-act="month" data-arg="1" aria-label="次の月" ' + (ym >= m.today.slice(0, 7) ? 'disabled' : '') + '>›</button></div>' +
    banner +
    '<div class="sum"><div><span>出勤日数</span><b class="num">' + t.workDays + '日</b></div><div><span>実労働</span><b class="num">' + hm(t.work) + '</b></div>' +
    '<div><span>残業' + (e.work_type === 'flex' && t.projection ? '（見込）' : '') + '</span><b class="num">' + hm(t.ot36) + '</b></div>' +
    '<div><span>うち週40h超</span><b class="num">' + hm(t.w40) + '</b></div><div><span>深夜</span><b class="num">' + hm(t.night) + '</b></div>' +
    '<div><span>有休・他の休</span><b class="num">' + (t.paid + t.other) + '日</b></div></div>' +
    (e.work_type === 'fixed' && t.lack ? '<p class="note" style="margin-bottom:8px">不足 <b class="num">' + hm(t.lack) + '</b>：休日出勤で充当 ' + hm(t.lackHol) + '・残業で充当 ' + hm(t.lackOt) + '・未充当 <b class="num" style="color:' + (t.lackLeft ? 'var(--out)' : 'inherit') + '">' + hm(t.lackLeft) + '</b>（同じ月の中で充当）</p>' : '') +
    (e.work_type === 'flex' ? '<p class="note" style="margin-bottom:8px">法定総枠 ' + hm(t.frame) + '・所定 ' + hm(t.sched) + '。残業は月末に確定します</p>' : '') +
    '<ul class="days">' + list + '</ul>';
}

/* ===================== 日の詳細・入力シート ===================== */
function findDay(date) { return S.month && S.month.rows.filter(function (d) { return d.date === date; })[0]; }
function sheetDay(date) {
  var m = S.month, d = findDay(date), e = m.emp, own = !S.viewEmp;
  if (!d) return '';
  var fixed = e.work_type === 'fixed', closed = m.status.closed, past = date <= m.today;
  var issues = d.flags.filter(function (f) { return f !== 'EDITED' && f !== 'BREAK_SHORT'; });
  var planEnd = planEndOf(e, d);
  var h = '<h2>' + mdw(date) + '</h2><p class="sub">' + (d.holidayName || { work: '平日', company: '所定休日', legal: '法定休日' }[d.type]) + '・' + TYPE[e.work_type] + '</p>' +
    '<dl class="kv"><dt class="grp">入退出（打刻）</dt><dt>出勤・退勤</dt><dd class="num">' + hhmm(d.punchIn) + ' 〜 ' + hhmm(d.punchOut) + (d.staggered ? ' <span class="pill c">時差出勤</span>' : '') + '</dd>' +
    (fixed ? '<dt class="grp">①残業事前申請</dt><dt>早出・終業予定</dt><dd class="num">' + (d.preStart != null || d.preEnd != null ? (d.preStart != null ? hhmm(d.preStart) : '—') + ' 〜 ' + (d.preEnd != null ? hhmm(d.preEnd) : '—') + '　' + esc(d.preReason) + '<br><small>' + esc(d.preApprover) + '</small>' : 'なし') + '</dd>' : '') +
    '<dt class="grp">②就業時間（帳票に記載する時間）</dt><dt>開始 a・終了 b</dt><dd class="num">' + (d.a != null ? hhmm(d.a) + ' 〜 ' + hhmm(d.b) : '—') + '</dd>' +
    '<dt>休憩</dt><dd class="num">' + hm(d.lunch + d.extraBreak) + (d.extraBreak ? '（うち③休憩等 ' + hm(d.extraBreak) + '）' : '') + '</dd>' +
    '<dt>実労働</dt><dd class="num">' + hm(d.work) + '</dd>' +
    '<dt>④残業（当日）</dt><dd class="num">' + (e.work_type === 'flex' ? '月末に確定' : hm(d.r)) + ((e.work_type === 'disc' || e.work_type === 'manager') && d.type === 'work' ? '（見做し）' : '') + '</dd>' +
    '<dt>週40h超・深夜</dt><dd class="num">' + hm(d.w40) + '・' + hm(d.night) + '</dd>' +
    (d.hol ? '<dt>休日労働</dt><dd class="num">' + hm(d.hol) + '</dd>' : '') +
    (d.leaveType ? '<dt>出勤状況</dt><dd>' + esc(d.leaveName) + '</dd>' : '') +
    (d.makeup ? '<dt>中抜けの補填</dt><dd class="num">終業後 ' + hm(d.makeup) + '（残業にしない）</dd>' : '') +
    (d.note ? '<dt>⑥備考</dt><dd>' + esc(d.note) + '</dd>' : '') + '</dl>' + offsetBox(d);
  if (issues.length || d.flags.indexOf('BREAK_SHORT') >= 0) h += '<p class="err" style="margin-top:10px">' + d.flagLabels.filter(function (f) { return f !== '修正済'; }).join('・') + '</p>';
  if (fixed && d.punchIn != null && d.punchIn < e.sched_start && d.preStart == null) h += '<p class="note" style="margin:8px 0">始業前（' + hhmm(d.punchIn) + '〜' + hhmm(e.sched_start) + '）は就業時間に含めていません。早出として計上するには事前申請（事後も可）が必要です</p>';
  if (m.pending[date]) h += '<p class="note" style="margin:8px 0">この日の申請が承認待ちです</p>';
  if (own && !closed) {
    if (d.flags.indexOf('DEVIATION') >= 0 && !m.pending[date]) {
      h += '<div class="alert" style="margin-top:10px"><b>退勤 ' + hhmm(d.punchOut) + ' は終業予定（' + hhmm(planEnd) + '）より遅れています</b><div class="row-btns">' +
        '<button class="btn primary" data-act="newPre" data-arg="' + date + '" data-post="1">業務だった：残業を事後申請</button>' +
        '<button class="btn ghost" data-act="devForm" data-arg="' + date + '">業務外だった：理由を入力</button></div></div>';
    }
    if (d.deviation === 'non_work') h += '<div class="row-btns"><button class="btn ghost sm" data-act="devClear" data-arg="' + date + '">「業務外」の申告を取り消す</button></div>';
    h += '<div class="row-btns">' +
      (past && d.punchOut != null ? '<button class="btn ghost" data-act="brkForm" data-arg="' + date + '">③休憩等を入力</button>' : '') +
      (past ? '<button class="btn ghost" data-act="newFix" data-arg="' + date + '">打刻の修正を申請</button>' : '') +
      (fixed ? '<button class="btn ghost" data-act="newPre" data-arg="' + date + '">残業・早出を申請</button>' : '') +
      '<button class="btn ghost" data-act="newLeave" data-arg="' + date + '">休暇を申請</button></div>';
  }
  return h + '<div class="row-btns"><button class="btn ghost" data-act="closeSheet">閉じる</button></div>';
}
function planEndOf(e, d) { return Math.max(e.sched_end + (S.boot.rules.makeup_enabled ? (d.extraBreak || 0) : 0), d.preEnd || 0); }
function offsetBox(d) {
  if (!d.lack && !(d.offsetTo && d.offsetTo.length)) return '';
  var s = '<div class="offset">';
  if (d.lack) {

function openForm(kind, date, post) {

function fillFromDay(sh, d, post) {
  sh.inTime = d && d.punchIn != null ? hhmm(d.punchIn) : '';
  sh.outTime = d && d.punchOut != null ? hhmm(d.punchOut) : '';
  sh.preStart = d && d.preStart != null ? hhmm(d.preStart) : '';
  var u = (S.boot && S.boot.rules.ot_unit_min) || 1;
  // 事後申請は退勤打刻を申請単位で切り捨てた時刻を初期値にする（18:40 → 18:30）
  sh.preEnd = post && d && d.punchOut != null ? hhmm(Math.floor(d.punchOut / u) * u) : (d && d.preEnd != null ? hhmm(d.preEnd) : '');

/* ===================== 申請一覧 ===================== */
function reqCard(r, forAppr) {
  var st = STATUS[r.status] || ['mute', r.status], body = '';
  if (r.kind === 'fix') {
    var row = function (lab, before, after) { return after ? '<span>' + lab + '</span><span class="num">' + (before == null ? '未打刻' : '<s>' + hhmm(before) + '</s>') + ' → <b>' + esc(after) + '</b></span>' : ''; };
    body = '<div class="diff">' + row('出勤', r.before && r.before.in, r.in_time) + row('退勤', r.before && r.before.out, r.out_time) + '</div>';
  } else if (r.kind === 'pre') {
    body = '<div class="diff">' + (r.pre_start ? '<span>早出開始</span><b class="num">' + esc(r.pre_start) + '</b>' : '') + (r.pre_end ? '<span>終業予定</span><b class="num">' + esc(r.pre_end) + '</b>' : '') + (r.is_post ? '<span>区分</span><span>事後申請</span>' : '') + '</div>';
  } else body = '<div class="diff"><span>休暇</span><b>' + esc(r.leaveName) + '</b></div>';
  var rej = S.rejecting === r.req_id, selectable = forAppr && r.status === 'pending';
  var title = '<b>' + (forAppr ? esc(r.empName) + '　' : '') + KIND[r.kind] + '　' + mdw(r.work_date) + '</b>';
  if (selectable) title = '<label class="chk"><input type="checkbox" data-sel="' + r.req_id + '" ' + (S.sel[r.req_id] ? 'checked' : '') + ' aria-label="一括承認の対象にする">' + title + '</label>';
  return '<div class="card' + (selectable && S.sel[r.req_id] ? ' sel' : '') + '"><div class="top2">' + title + '<span class="pill ' + st[0] + '">' + st[1] + '</span></div>' + body +
    '<p class="meta">理由：' + esc(r.reason) + '</p>' + (r.comment ? '<p class="meta" style="color:var(--out)">コメント：' + esc(r.comment) + '</p>' : '') +
    '<p class="meta">申請 ' + esc(r.created_at.slice(5, 16).replace('T', ' ')) + (r.approver_name && r.status !== 'pending' ? '　処理 ' + esc(r.approver_name) : '') + '</p>' +
    (forAppr && r.status === 'pending' ? (rej
      ? '<label class="field" style="margin-top:8px"><span>差し戻す理由</span><textarea id="rejectComment" maxlength="200"></textarea></label><div class="row-btns"><button class="btn ghost" data-act="rejectCancel">やめる</button><button class="btn primary" data-act="rejectSend" data-arg="' + r.req_id + '" ' + (S.busy ? 'disabled' : '') + '>差し戻す</button></div>'
      : '<div class="row-btns"><button class="btn ghost" data-act="reject" data-arg="' + r.req_id + '">差し戻す</button><button class="btn primary" data-act="approve" data-arg="' + r.req_id + '" ' + (S.busy ? 'disabled' : '') + '>承認する</button></div>') : '') +
    (!forAppr && r.status === 'pending' ? '<div class="row-btns"><button class="btn ghost sm" data-act="cancelReq" data-arg="' + r.req_id + '">取り下げる</button></div>' : '') +
    '</div>';
}

  S.tab = tab; S.sheet = null;

function selectedIds() {
  if (!S.appr) return [];
  return S.appr.pending.filter(function (r) { return S.sel[r.req_id]; }).map(function (r) { return r.req_id; });
}
function bulkToast(r) {
  if (!r.failed.length) return toast(r.done + '件を承認しました');
  toast(r.done + '件を承認しました。承認できなかったもの：' + r.failed.map(function (f) { return f.label + '（' + f.message + '）'; }).join('、'), true);
}
function ensureMonth(date, fn) {
  if (S.month && S.month.ym === date.slice(0, 7) && !S.viewEmp) return fn();
  S.viewEmp = null;
  call('apiMonth', date.slice(0, 7), '').then(function (m) { S.month = m; S.ym = m.ym; fn(); }).catch(fail);
}
document.addEventListener('input', function (ev) {
  var el = ev.target, f = el.dataset.f;
  if (el.dataset.mf) { masterInput(el); return; }
  if (!f) return;
  if (f === 'formTarget') { S.formTarget = el.value; return; }
  if (S.sheet) S.sheet[f] = el.value;
});
document.addEventListener('change', function (ev) {
  var el = ev.target, f = el.dataset.f;
  if (el.dataset.mf) { masterInput(el); return; }
  if (el.dataset.sel) { if (el.checked) S.sel[el.dataset.sel] = true; else delete S.sel[el.dataset.sel]; render(); return; }
  if (el.dataset.selall) { S.sel = {}; if (el.checked && S.appr) S.appr.pending.forEach(function (r) { S.sel[r.req_id] = true; }); render(); return; }
  if (!f) return;
  if (f === 'formTarget') { S.formTarget = el.value; return; }
  if (!S.sheet) return;
  S.sheet[f] = el.value;
  if (el.dataset.refill && S.sheet.kind === 'form') {
    var date = el.value;
    if (date && S.month && S.month.ym === date.slice(0, 7)) { fillFromDay(S.sheet, findDay(date), false); render(); }
  }
  if (el.tagName === 'SELECT') render();
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });

/* ===================== 起動 ===================== */
call('apiBootstrap').then(function (b) {
  S.boot = b; S.apprYm = addMonths(b.today.slice(0, 7), -1); S.adminYm = addMonths(b.today.slice(0, 7), -1);
  if (location.hash === '#mail-connected' && b.isAdmin) {
    history.replaceState(null, '', '/');
    S.adminTab = 'emp'; go('admin'); toast('メール送信のアカウントを接続しました。テストメールで確認してください');
    return;
  }
  render();
  return loadHome().then(function () { render(); if (b.isApprover) loadAppr().then(renderTabs).catch(function () {}); });
}).catch(function (e) {
  $('main').innerHTML = '<div class="alert"><b>開けませんでした</b><br>' + esc(e && e.message ? e.message.replace(/^Error:\s*/, '') : e) + '<div class="act"><a class="link-btn" href="/logout">別のアカウントでログイン</a></div></div>';
});
</script>
